version: '3.8'

services:
  tatucar-crm:
    build: .
    container_name: tatucar_crm_app
    restart: always
    ports:
      - "3000:3000"
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      - STORE_NAME=TatuCar Veículos Curitiba
      - WHATSAPP_PHONE=(41) 99535-0811
    networks:
      - tatucar-network

  # Servico opcional de Evolution API (WhatsApp Gateway Oficial)
